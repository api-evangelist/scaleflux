aid: scaleflux
name: ScaleFlux
description: 'ScaleFlux is a semiconductor and systems company, founded in 2014 and
  headquartered in Milpitas / San Jose, California, that designs enterprise NVMe SSD
  controllers, computational storage drives and CXL memory products. Its FX-series
  SoC controllers (SFX 3016, FX 5016) embed transparent hardware compression, so drives
  such as the CSD 2000, CSD 3000 and CSD 5000 series present substantially more logical
  than physical capacity while offloading compression and data-shaping work from the
  host CPU. The company also ships non-compressing NSD drives and CXL memory expansion
  silicon aimed at AI, cloud and database infrastructure. ScaleFlux is a hardware vendor
  rather than a web-API provider: it publishes no public REST, GraphQL or webhook API.
  Its programmable surface is the NVMe standard command set plus the vendor-specific
  "sfx" extensions shipped as an upstream plugin in linux-nvme/nvme-cli (sfx-nvme),
  together with kernel driver and utility packages distributed through packagecloud.io.'
